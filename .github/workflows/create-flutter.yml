name: Flutter Base Generator

on: [workflow_dispatch]

jobs
generate
runs-on: ubuntu-latest
contents: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Generate Flutter project
    run: |
      flutter create --platforms=android --org com.vionaa --project-name vionaa_flutter flutter_project

  - name: Save project to GitHub
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add flutter_project
      git commit -m "Generate Flutter base"
      git push
