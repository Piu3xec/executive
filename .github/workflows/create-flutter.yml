name: Flutter Base APK

'on':
workflow_dispatch:

permissions:
contents: write

jobs:
generate-and-build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      persist-credentials: true

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Generate Flutter Project
    run: |
      if [ ! -f flutter_project/pubspec.yaml ]; then
        flutter create \
          --platforms=android \
          --org com.vionaa \
          --project-name vionaa_flutter \
          flutter_project
      fi

  - name: Install Flutter Dependencies
    working-directory: flutter_project
    run: flutter pub get

  - name: Build Debug APK
    working-directory: flutter_project
    run: flutter build apk --debug

  - name: Save Flutter Project to Repository
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add flutter_project/
      if ! git diff --cached --quiet; then
        git commit -m "Create Flutter base project"
        git push
      else
        echo "Project sudah tersimpan."
      fi

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: VionaaFlutter-Debug-APK
      path: flutter_project/build/app/outputs/flutter-apk/app-debug.apk
      if-no-files-found: error
      retention-days: 30
